<div class="cover">
  <div class="subject">{{meta.subject}} · {{meta.grade}}</div>
  <h1 class="title">{{title}}</h1>
  {{#subtitle}}<p class="subtitle">{{subtitle}}</p>{{/subtitle}}
  <div class="meta">
    {{#meta.teacher}}<span>{{meta.teacher}}</span>{{/meta.teacher}}
    {{#meta.date}}<span>{{meta.date}}</span>{{/meta.date}}
    {{#duration}}<span>{{duration}} 分钟</span>{{/duration}}
  </div>
</div>
