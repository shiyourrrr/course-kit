<div class="cine cine-statement">
  <header class="cine-top"><span>{{meta.grade}} · {{meta.subject}}</span><span>{{meta.title}}</span></header>
  <main class="cine-spread">
    <div class="cine-heading"><div class="cine-kicker">{{kicker}}</div><h2 data-anim="fade-up">{{statement}}</h2></div>
    <div class="cine-explanation"><ol class="cine-points">{{#points}}<li><span class="cine-no">{{@no}}</span><span>{{text}}</span></li>{{/points}}</ol>{{#note}}<p class="cine-note">{{note}}</p>{{/note}}</div>
  </main>
  <footer class="cine-foot"><span>{{meta.subject}} · {{meta.title}}</span><span>全屏 F</span></footer>
</div>
