<!--
  自由编排示例：面积法证明
  这一页没有用任何「页型」，是 AI 拿积木现搭的：
  12 栏网格（.cols + .c7/.c5）+ 面板堆叠（.stack + .panel）+ 提示条（.callout）
  + 动效（data-anim / data-build）+ 页内样式（写在 deck.json 的 css 字段）。

  动效：标题滑入 → 图从右侧滑入 → 推导按 1/2/3/4 点一下出一步。
  讲课时按右方向键逐步揭示，最后一步揭示完才翻页。
-->
<div class="kicker" data-anim="fade-up">面积法证明</div>
<h2 class="title" data-anim="fade-up" data-delay="60">四个三角形，拼出 $a^2+b^2=c^2$</h2>

<div class="body">
  <div class="cols">
    <div class="c7">
      <div class="figure" data-anim="slide-right" data-delay="120">
        <svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="四个直角三角形拼成大正方形的面积法证明">
          <g fill="#e8eefc" stroke="#111827" stroke-width="2" stroke-linejoin="round">
            <path d="M140 50 L300 50 L140 310 Z" />
            <path d="M300 50 L560 50 L560 210 Z" />
            <path d="M560 210 L560 470 L400 470 Z" />
            <path d="M400 470 L140 470 L140 310 Z" />
          </g>
          <g data-anim="fade" data-delay="380">
            <path d="M300 50 L560 210 L400 470 L140 310 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" />
            <text x="350" y="268" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1d4ed8" text-anchor="middle">c²</text>
          </g>
          <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="22" fill="#111827" text-anchor="middle">
            <text x="220" y="38">a</text>
            <text x="430" y="38">b</text>
            <text x="452" y="118">c</text>
          </g>
        </svg>
      </div>
      <p class="caption" data-anim="fade" data-delay="320">大正方形边长 = $a+b$；中间白方块边长 = $c$</p>
    </div>

    <div class="c5">
      <div class="stack stack-sm">
        <div class="panel panel-soft" data-build="1">
          <span class="small muted">四个三角形</span>
          <div class="step-formula">$$4\times\tfrac{1}{2}ab$$</div>
        </div>
        <div class="panel panel-soft" data-build="2">
          <span class="small muted">加上中间正方形</span>
          <div class="step-formula">$$4\times\tfrac{1}{2}ab + c^2$$</div>
        </div>
        <div class="panel panel-soft" data-build="3">
          <span class="small muted">正好等于大正方形</span>
          <div class="step-formula">$$= (a+b)^2$$</div>
        </div>
        <div class="callout" data-build="4">
          <span class="callout-title">两边同时减掉 $2ab$</span>
          得到 $c^2=a^2+b^2$ —— 这就是勾股定理。
        </div>
      </div>
    </div>
  </div>
</div>
