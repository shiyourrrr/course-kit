<div class="cine cine-paper">
  <header class="cine-top">
    <div class="cine-brand">勾股定理 <span class="sep">/</span> 定理本身</div>
    <div class="cine-counter">03 <span class="dim">/</span> 10</div>
  </header>

  <div class="cine-body">
    <div class="cine-kicker">核心结论</div>
    <div class="cine-title cine-title-sm" data-anim="fade-up">两条直角边的平方和，等于斜边的平方</div>

    <div class="cine-cols">
      <div class="cine-left">
        <div class="cine-figure" data-anim="fade">$$a^2+b^2=c^2$$</div>
        <div class="cine-caption">前提：∠C = 90°，c 为斜边</div>
        <div class="cine-chips">
          <span class="cine-chip is-on">a、b 可交换</span>
          <span class="cine-chip">c 恒为最长边</span>
          <span class="cine-chip">只适用于直角三角形</span>
        </div>
      </div>
      <div class="cine-right">
        <h3 data-anim="fade-up">为什么它重要</h3>
        <p data-anim="fade-up" data-delay="80">它把“长度”换算成了“面积”：三块正方形之间的加减关系，就是三边之间的关系。</p>
        <hr>
        <p class="dim" data-anim="fade-up" data-delay="160">因此所有关于斜边的计算，都可以回到“拼面积”这件事上。</p>
      </div>
    </div>
  </div>

  <footer class="cine-foot">
    <span>初中数学 · 勾股定理</span>
    <span class="cine-keys">全屏 F</span>
  </footer>
