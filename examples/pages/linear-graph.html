<!--
  自由编排示例（第二节）：一次函数的图像
  坐标系 + 两条直线，用 SVG 手写；说明 k 的符号决定方向。
-->
<div class="kicker" data-anim="fade-up">看图像</div>
<h2 class="title" data-anim="fade-up" data-delay="60">$k$ 的正负，决定直线往哪走</h2>

<div class="body">
  <div class="cols">
    <div class="c7">
      <div class="figure" data-anim="slide-right" data-delay="120">
        <svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="两条一次函数图像：k 为正上升，k 为负下降">
          <g stroke="#e5e7eb" stroke-width="1">
            <line x1="110" y1="60" x2="110" y2="360" /><line x1="150" y1="60" x2="150" y2="360" />
            <line x1="190" y1="60" x2="190" y2="360" /><line x1="230" y1="60" x2="230" y2="360" />
            <line x1="270" y1="60" x2="270" y2="360" /><line x1="310" y1="60" x2="310" y2="360" />
            <line x1="350" y1="60" x2="350" y2="360" /><line x1="390" y1="60" x2="390" y2="360" />
            <line x1="70" y1="320" x2="390" y2="320" /><line x1="70" y1="280" x2="390" y2="280" />
            <line x1="70" y1="240" x2="390" y2="240" /><line x1="70" y1="200" x2="390" y2="200" />
            <line x1="70" y1="160" x2="390" y2="160" /><line x1="70" y1="120" x2="390" y2="120" />
            <line x1="70" y1="80" x2="390" y2="80" />
          </g>
          <g stroke="#111827" stroke-width="2">
            <line x1="45" y1="360" x2="610" y2="360" />
            <line x1="70" y1="395" x2="70" y2="45" />
          </g>
          <path d="M610 360 l-12 -5 v10 z" fill="#111827" />
          <path d="M70 45 l-5 12 h10 z" fill="#111827" />
          <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" fill="#6b7280">
            <text x="618" y="366">x</text>
            <text x="78" y="40">y</text>
            <text x="48" y="380">O</text>
          </g>
          <line x1="70" y1="320" x2="390" y2="0" stroke="#1d4ed8" stroke-width="3" data-anim="fade" data-delay="260" />
          <line x1="70" y1="240" x2="250" y2="420" stroke="#c2410c" stroke-width="3" data-anim="fade" data-delay="420" />
          <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">
            <text x="300" y="80" fill="#1d4ed8">y = x + 1（k &gt; 0）</text>
            <text x="250" y="330" fill="#c2410c">y = -x + 3（k &lt; 0）</text>
          </g>
        </svg>
      </div>
      <p class="caption" data-anim="fade" data-delay="320">两条直线的 b 都不同，但方向只由 k 的正负决定</p>
    </div>

    <div class="c5">
      <div class="stack stack-sm">
        <div class="panel panel-soft" data-build="1">
          <span class="small muted">$k > 0$</span>
          <p class="small">直线从左下往右上，$y$ 随 $x$ 增大而增大（增函数）。</p>
        </div>
        <div class="panel panel-soft" data-build="2">
          <span class="small muted">$k \lt 0$</span>
          <p class="small">直线从左上往右下，$y$ 随 $x$ 增大而减小（减函数）。</p>
        </div>
        <div class="panel panel-soft" data-build="3">
          <span class="small muted">$b$ 管什么</span>
          <p class="small">$b$ 是与 $y$ 轴交点的纵坐标：直线必过 $(0,\;b)$。</p>
        </div>
        <div class="callout" data-build="4">
          <span class="callout-title">一句话</span>
          $k$ 定方向，$b$ 定位置。
        </div>
      </div>
    </div>
  </div>
</div>
