<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>杂志风示例模板</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC">
<style>
  body { margin: 0; background: #f4efe6; color: #23201c;
         font-family: "Noto Serif SC", "Songti SC", serif; }
  section { height: 720px; padding: 88px 96px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center;
            border-bottom: 1px solid #d8cec0; }
  h1 { font-size: 76px; margin: 0 0 28px; letter-spacing: .02em; }
  h2 { font-size: 46px; margin: 0 0 24px; }
  p  { font-size: 24px; line-height: 1.85; margin: 0 0 18px; max-width: 880px; color: #4a423a; }
  .tag { font-size: 16px; letter-spacing: .24em; color: #a2603c; margin-bottom: 18px; }
</style>
</head>
<body>
  <section>
    <div class="tag">八年级 · 数学</div>
    <h1>勾股定理</h1>
    <p>从四个三角形开始，把一条公式讲成一块可以拼起来的面积。</p>
  </section>

  <section>
    <h2>定理说的是什么</h2>
    <p>两条直角边的平方和，等于斜边的平方。</p>
    <p>它把长度换成了面积：三块正方形之间的加减，就是三边之间的关系。</p>
  </section>
  <hr>
  <section>
    <h2>用之前先确认</h2>
    <p>只有直角三角形才成立，斜边一定是直角所对的边。</p>
  </section>

  <script>window.analytics = function(){ /* 演示用：导入时会被剥掉 */ };</script>
</body>
</html>
